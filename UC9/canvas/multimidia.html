<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #222;
        color: white;
      }
      canvas {
        border: 1px solid #000000;
        margin: 20px 0;
        display: block;
        margin: 10px auto;
      }
      button {
        padding: 10px 20px;
        margin: 10px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body id="mainBody">
    <h1>Canvas e web audio</h1>
    <canvas id="meuCanvas" width="300" height="150"></canvas>

    <div>
      <button onclick="tocarSom()">Tocar som (Web Audio)</button>
      <button onclick="alternarFullscreen()">Tela cheia</button>
    </div>

    <script>
      // Canvas API
      const canvas = document.getElementById("meuCanvas");
      const ctx = canvas.getContext("2d");
      //   ctx.fillStyle = "#ff4757";
      //   ctx.fillRect(50, 30, 200, 90);
      const cores = [
        "#ff4757",
        "#2ed573",
        "#ffa502",
        "#1e90ff",
        "#ff6b81",
        "#70a1ff",
      ];
      // Função para gerar uma cor aleatória
      const coresaleatorias = cores[Math.floor(Math.random() * cores.length)];
      // Função para desenhar círculos aleatórios
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height;
      // Raio aleatório entre 10 e 30
      const raio = Math.random() * 40 + 10;
      // Desenha o círculo
      ctx.beginPath();
      ctx.arc(x, y, raio, 0, Math.PI * 2);
      // Preenche o círculo com uma cor aleatória
      ctx.fillStyle = coresaleatorias();
      // Preenche o círculo
      ctx.fill();
      // Desenha a borda do círculo
      ctx.lineWidth = 3;
      // Define a cor da borda como branco
      ctx.strokeStyle = "#ffffff";
      //
      ctx.stroke();

      // Web Audio Api

      function tocarSom() {
        // 1. Crie o contexto de áudio apenas UMA vez, fora do loop
        const audioCtx = new (
          window.AudioContext || window.webkitAudioContext
        )();
        const oscillator = audioCtx.createOscillator();

        // 'sawtooth' ou 'triangle' soam mais como sirene real do que 'sine'
        oscillator.type = "sine";

        const agora = audioCtx.currentTime;
        const duracaoCiclo = 10; // 1 segundo por ciclo (sobe e desce)
        const repeticoes = 5;

        // Frequência inicial (grave)
        oscillator.frequency.setValueAtTime(700, agora);

        for (let i = 0; i < repeticoes; i++) {
          const inicioCiclo = agora + i * duracaoCiclo;
          const meioCiclo = inicioCiclo + duracaoCiclo / 2;
          const fimCiclo = inicioCiclo + duracaoCiclo;

          // Sobe até 900 Hz na metade do ciclo
          oscillator.frequency.linearRampToValueAtTime(2500, meioCiclo);
          // Volta para 700 Hz no final do ciclo
          oscillator.frequency.linearRampToValueAtTime(700, fimCiclo);
        }

        // Conecte apenas uma vez
        oscillator.connect(audioCtx.destination);

        // Inicia agora e para ao final das 5 repetições
        oscillator.start(agora);
        oscillator.stop(agora + repeticoes * duracaoCiclo);
      }
    </script>
  </body>
</html>
