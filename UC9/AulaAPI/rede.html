<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunicação em Rede</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 30px;
            background-color: #f4f4f9;
        }

        input, button{
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #resultadoFetch, #resultadoWebSocket{
            background: #fff;
            padding: 20px;
            height: 120px;
            overflow-y: auto;
            font-family: monospace;
            margin-top: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            white-space: pre-wrap; /* Mantém a formatação do texto */
        }

    </style>
</head>
<body>
    <h2>Fetch API (Requisição HTTP)</h2>
    <button onclick="buscarDados()">Buscar Usuario</button>
    <pre id="resultadoFetch"></pre>


    <h2>WebSockets (Tempo Real)</h2>
    <input type="text" id="msgInput" placeholder="Digite uma mensagem">
    <button onclick="enviarMensagem()">Enviar</button>
    <div id="resultadoWebSocket"></div>

   <script>
     async function buscarDados(){
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/users/1'); // URL da API para buscar o usuário com ID 1
                const data = await response.json(); // Converte a resposta para JSON
                document.getElementById('resultadoFetch').textContent = JSON.stringify(data, null, 2); // Exibe os dados formatados no elemento <pre>
            } catch (error) {
                console.error('Erro ao buscar dados:', error);
            }
     }

     // WebSockets API (Usando o serviço de echo.websocket.org para demonstração)

        const ws = new WebSocket('wss://ws.postman-echo.com/raw'); // Cria uma nova conexão WebSocket
        const logDiv = document.getElementById('resultadoWebSocket'); // Elemento onde as mensagens serão exibidas

        ws.onopen = () => {
            logDiv.innerHTML += 'Conexão WebSocket aberta. <br>'; // Mensagem quando a conexão é aberta
        }

        ws.onmessage = (event) => {
            logDiv.innerHTML += `Mensagem recebida: ${event.data}<br>`; // Exibe a mensagem recebida do servidor
        }

        function enviarMensagem(){
            const msg = document.getElementById('msgInput').value;
            ws.send(msg); // Envia a mensagem para o servidor WebSocket
            logDiv.innerHTML += `Mensagem enviada: ${msg}<br>`; // Exibe a mensagem enviada no log
            document.getElementById('msgInput').value = ''; // Limpa o campo de entrada após enviar a mensagem
        }
   </script>

</body>
</html>
